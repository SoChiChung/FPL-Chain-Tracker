# FPL Chain Tracker 定时数据采集。design.md §13。
name: Update FPL data

on:
  schedule:
    # 每 30 分钟一次（UTC）。注意 FPL API 对高频轮询可能限流（429），
    # crawler 已按 Retry-After 处理；若被限流可降低此频率
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["crawler/**", "config.json", ".github/workflows/update-data.yml"]

# 必须显式声明。GitHub 对个人账号新建仓库的 GITHUB_TOKEN 默认只有 contents: read，
# 缺这一行时的表现是：抓取成功、commit 成功，但 git push 被 403 拒绝，数据永远上不去。
# 仓库设置里的「Workflow permissions」只是默认值，工作流可以用本键自行提权。
permissions:
  contents: write

concurrency:
  group: fpl-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 默认 fetch-depth: 1 是浅克隆，下面兜底分支里的 git pull --rebase 不可靠
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run crawler
        run: python crawler/run.py --config config.json

      - name: Commit and push data changes
        run: |
          git config user.name "FPLChainTracker Bot"
          git config user.email "fpl-chain-tracker[bot]@users.noreply.github.com"

          # data/ 在 .gitignore 中，必须用 -f 强制加入；排除 .tmp 临时目录
          git add -f data/ ':(exclude)data/.tmp'

          # 用「暂存区 vs HEAD」判定是否有真实内容变化。
          # 原来的 git diff 只比较已跟踪文件，会漏掉首次出现的 data/gw-NN.json；
          # meta.json 每次都刷新时间戳，判定时必须排除，否则每 30 分钟产生一次空提交。
          # 注意：仅「判定」时排除，提交时 meta.json 仍在暂存区、会一并提交（前端需要它的字段）。
          if git diff --cached --quiet -- data/ ':(exclude)data/meta.json'; then
            echo "No content changes; skip commit"
            exit 0
          fi

          git commit -m "chore(data): update FPL chain tracker data [skip ci]"
          git push || {
            echo "Push failed, retrying after rebase"
            git pull --rebase
            git push
          }
